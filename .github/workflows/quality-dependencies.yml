# Known vulnerabilities in the locked dependencies (pip-audit), when pyproject.toml or uv.lock
# changes on main, weekly (advisories are published after the last change; GitHub disables
# schedules in repositories without activity for 60 days) and on demand (ADR 0021). Fails on
# findings.
name: Quality (dependencies)

on:
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/quality-dependencies.yml"
  schedule:
    - cron: "23 6 * * 1" # weekly
  workflow_dispatch:

permissions: {}

# The event is part of the group: a push cancels an older push run, never a scheduled or a
# manual one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    name: Dependencies (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: false

      # Every package of uv.lock (runtime and dev), pinned with hashes, checked against the
      # PyPI / OSV advisory database without installing anything.
      - name: pip-audit
        run: |
          uv export --locked --no-emit-project --format requirements-txt \
            --output-file "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit@2.10.1 --disable-pip --progress-spinner off \
            --requirement "$RUNNER_TEMP/requirements.txt"
