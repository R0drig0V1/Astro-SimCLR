# Committed secrets: gitleaks over the full history, on every push to main (cheap, and a
# leaked secret must be found at once) and on demand. The other quality checks run only when
# their inputs change (ADR 0021): quality-workflows.yml (zizmor, actionlint) and
# quality-dependencies.yml (pip-audit). Every job fails on findings.
name: Quality

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# The event is part of the group: a push cancels an older push run, never a scheduled or a
# manual one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the whole history, not just the tip
          persist-credentials: false

      # The gitleaks CLI (MIT), not gitleaks-action (which needs a licence key for
      # organization-owned repositories).
      - name: gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tarball"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$tarball" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --verbose .
