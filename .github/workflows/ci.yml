# Continuous integration: the torch-wheel assertions of ADR 0001
# (scripts/check-torch-wheels.sh), then the same checks as scripts/check.sh (ruff, mypy,
# pytest with coverage). ADR 0021: pull requests are gated locally by the integrator's
# verify-merge.sh (scripts/check.sh on the merged tree), so CI runs only on pushes to main
# (ubuntu-latest, x86_64; docs-only pushes skipped), weekly on macos-latest (arm64), and on
# demand (workflow_dispatch: any OS, never filtered by paths).
# CI installs the CPU torch build (`--extra cpu`) on both: the default Linux build is CUDA 13
# and would download ~3 GB of nvidia-* wheels that no test uses.
name: CI

on:
  push:
    branches: [main]
    # A push whose files all match is skipped; a push that touches any other file runs.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "results/**"
  schedule:
    - cron: "29 4 * * 1" # weekly, macOS only (ubuntu ran on the last code push)
  workflow_dispatch:
    inputs:
      os:
        description: Runners to check on
        type: choice
        options: [all, ubuntu-latest, macos-latest]
        default: all

permissions:
  contents: read

# The event is part of the group, so a push to main cancels an older push run (the
# integrator pushes in batches: only the newest tip needs checking) but never the weekly
# macOS run or a manual one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # The portability rule of the plan: the same code and tests on x86_64 Linux and arm64
    # macOS, both with the cpu extra (the macOS cpu wheel includes MPS). The MPS test
    # variants run when the runner exposes MPS (it did in PR #9) and skip otherwise; the
    # CUDA ones skip on both. The matrix depends on the event (ADR 0021): push -> ubuntu,
    # schedule -> macOS, workflow_dispatch -> the `os` input (both by default).
    name: Lint, types, tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: >-
          ${{ fromJSON(
            github.event_name == 'push' && '["ubuntu-latest"]'
            || github.event_name == 'schedule' && '["macos-latest"]'
            || inputs.os == 'ubuntu-latest' && '["ubuntu-latest"]'
            || inputs.os == 'macos-latest' && '["macos-latest"]'
            || '["ubuntu-latest", "macos-latest"]'
          ) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # uv installs the Python of .python-version; the tools are pinned by uv.lock.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: false

      - run: uv sync --locked --extra cpu

      # The installed environment must hold no nvidia-* package (ADR 0001).
      - name: No CUDA wheels installed
        run: |
          if uv pip list --format freeze | grep -i '^nvidia-'; then
            echo "nvidia-* packages installed; the cpu extra was not applied" >&2
            exit 1
          fi

      # Resolves the lock only (dry-runs); downloads nothing.
      - run: scripts/check-torch-wheels.sh

      # UV_NO_SYNC: `uv run` would otherwise re-sync the default extras and replace the
      # CPU torch with the CUDA one.
      - run: scripts/check.sh
        env:
          UV_NO_SYNC: "1"
