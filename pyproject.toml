[project]
name = "astro-simclr"
version = "0.1.0"
description = "SimCLR and supervised contrastive learning on ZTF astronomical event stamps"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Rodrigo Vidal" },
]
dependencies = []

[dependency-groups]
# Development tools, pinned exactly by uv.lock and updated by Dependabot.
dev = [
    "ruff>=0.17.3",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pre-commit>=4.7.0",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
# Legacy research code, linted again as it is refactored into src/astro_simclr/.
extend-exclude = [
    "fine_tuning.py",
    "hyperparams_ce.py",
    "hyperparams_ce_resnet.py",
    "hyperparams_clr.py",
    "iter_ce_resnet.py",
    "iter_ce_stamp.py",
    "iter_clr.py",
    "linear_classifier.py",
    "visualization_embedded.py",
    "losses/",
    "models/",
    "utils/",
    "jupyter_examples/",
    "results/",
]

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, bugbear, pyupgrade, flake8-bandit (security), simplify, ruff
# and mccabe complexity.
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "C90"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"] # pytest asserts

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--cov", "--cov-report=term-missing"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
