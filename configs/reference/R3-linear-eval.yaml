# R3, step 2: linear evaluation of the R3 encoder, with R1's classifier hyperparameters.
# Run, for each label fraction (one seed each):
#   astro-simclr linear-eval --config configs/reference/R3-linear-eval.yaml --seed 0
#     --pretrained OUT/R3/pretrain --set dataset=DATASET --output-dir OUT/R3/linear-eval-P
#   with DATASET td_ztf_stamp_17_06_20_sup_1 (1 %, the default below),
#   td_ztf_stamp_17_06_20_sup_10 (10 %) and td_ztf_stamp_17_06_20_red-002 (100 %: the
#   received stand-in of the legacy td_ztf_stamp_17_06_20.pkl, as in R1).
# compare-reference --ref R3 needs all three fractions.
# The preflight also runs fine-tune with this config (lr x fine_tune_lr_factor 0.2, as the
# legacy fine_tuning.py); fine-tuning is not part of R3's gate.
#
# Provenance (docs/phases/01-runnable-package.md, "Reference runs"):
# - R1's classifier hyperparameters (AdamW, batch 45, lr, beta_loss), with_features false
#   (the 31b10c9 run used no features) and augmentation without_aug;
# - protocol of linear_classifier.py: max 220 epochs, patience 40, min_delta 0.001 on
#   accuracy_val; eval batch 100.
# - the legacy double softmax of the linear head's loss is kept (task 1.6).

accelerator: cuda
devices: 1
num_workers: 4

dataset: td_ztf_stamp_17_06_20_sup_1
image_size: 27
with_features: false
augmentation: without_aug
batch_size: 45
eval_batch_size: 100
optimizer: AdamW
lr: 0.002495379490073152
beta_loss: 0.016063800410738464
drop_rate: 0.2

max_epochs: 220
patience: 40
min_delta: 0.001
monitor: accuracy_val
check_finite: true
